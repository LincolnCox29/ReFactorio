[technology-description]
crushing=Allows the construction of crushers for grinding materials.
silicon-processing=Unlocks the production of silicon plates and semiconductor materials.
radio-components=Allows the creation of basic radio-electronic components: resistors, capacitors, and transistors.
microelectronics=The miniaturization of electronic components. Allows placing thousands of transistors on a single silicon wafer.
volatile-memory=Random-access memory is fast but forgetful: cut the power, and every stored bit vanishes. This technology unlocks RAM — the working memory of every computing machine.
blast-furnance=The blast furnace unlocks alloy smelting.