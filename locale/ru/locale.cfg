[technology-description]
silicon-processing=Открывает возможность производства кремниевых пластин и полупроводниковых материалов.
radio-components=Позволяет создавать базовые радиоэлектронные компоненты: резисторы, конденсаторы и транзисторы.
crushing=Позволяет создавать дробители для измельчения материалов.
microelectronics=Миниатюризация электронных компонентов. Позволяет размещать тысячи транзисторов на одной кремниевой пластине.
volatile-memory=Оперативная память быстра, но забывчива: отключите питание — и каждый сохранённый бит исчезнет. Эта технология открывает RAM — рабочую память любой вычислительной машины.